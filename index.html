<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sebastien Fernandez | NFC Card</title>
    <meta
      name="description"
      content="NFC virtual card for Sebastien Fernandez with quick links to About, Contact, and Share."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar container">
      <div class="brand">
        <span class="suit">♠</span>
        <span class="suit">♦</span>
        <span class="suit">♣</span>
        <span class="suit">♥</span>
        <span class="brand-text">Card / Business Card</span>
      </div>
      <nav>
        <a href="about.html">About Me</a>
        <a href="about.html#contact">Contact Me</a>
      </nav>
    </header>

    <main>
      <section class="hero container product-hero">
        <article class="product-card">
          <img
            class="product-image"
            src="Profile.png"
            alt="Portrait of Sebastien Fernandez"
          />
          <p class="eyebrow">NFC Virtual Card</p>
          <h1 class="product-name">
            <a href="about.html">Sebastien Fernandez &gt;</a>
          </h1>
          <p class="product-summary">
            Mechanical engineering builder with a systems mindset—designed for complex problems,
            disciplined execution, and long-term value creation.
          </p>
          <div class="cta-row card-actions">
            <a class="btn btn-primary" href="about.html">About Me</a>
            <a class="btn btn-secondary" href="about.html#contact">Contact Me</a>
            <button class="btn btn-secondary" id="share-card-btn" type="button">Share Card</button>
          </div>
          <p id="share-status" class="muted share-status" aria-live="polite"></p>
        </article>
      </section>
    </main>

    <footer class="container footer">
      <p>© <span id="year"></span> Sebastien Fernandez.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
